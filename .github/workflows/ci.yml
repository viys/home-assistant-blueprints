name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  blueprints:
    name: Blueprint validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: config/testing/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r config/testing/requirements.txt
      - name: Validate all blueprints and catalogue links
        run: python -m unittest discover -s tests -p test_blueprints.py -v

  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: config/testing/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r config/testing/requirements.txt
      - name: Run all tests
        run: python -m unittest discover -s tests -v

  coverage:
    name: Simulated YAML coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report-id: ${{ steps.coverage-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: config/testing/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r config/testing/requirements.txt
      - name: Measure YAML actions and branches
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            python -m tools.run_coverage --base "$BASE_SHA"
          else
            python -m tools.run_coverage
          fi
      - name: Upload coverage reports
        id: coverage-artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blueprint-coverage
          path: coverage-report/
          if-no-files-found: warn
          retention-days: 14

  coverage-comment:
    name: PR coverage report
    needs: coverage
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      # Consume report data only; do not check out or run test code with a write token.
      - name: Download coverage report
        if: needs.coverage.outputs.report-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.coverage.outputs.report-id }}
          path: coverage-report
          merge-multiple: true
      - name: Create or update coverage comment
        if: always() && !cancelled()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          REPORT_ARTIFACT_ID: ${{ needs.coverage.outputs.report-id }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- blueprint-simulated-coverage -->';
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const summaryFile = 'coverage-report/summary.md';
            const summary = fs.existsSync(summaryFile)
              ? fs.readFileSync(summaryFile, 'utf8')
              : 'Coverage report unavailable. Check the workflow logs for setup or test execution errors.';
            const shortened = summary.length > 58000
              ? `${summary.slice(0, 58000)}\n\n_Report truncated; download the complete report below._`
              : summary;
            const status = process.env.COVERAGE_RESULT === 'success' ? 'PASS' : 'FAIL';
            const artifactId = process.env.REPORT_ARTIFACT_ID;
            const links = artifactId
              ? `[Full HTML/JSON report](${runUrl}/artifacts/${artifactId}) · [Workflow run](${runUrl})`
              : `[Workflow run](${runUrl})`;
            const body = `${marker}\n## Blueprint coverage report\n\nCommit: \`${pull.head.sha}\` · Coverage check: **${status}**\n\n${shortened}\n\n${links}\n\n_Updated automatically for this PR._`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull.number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            const { data: current } = await github.rest.pulls.get({
              owner, repo, pull_number: pull.number,
            });
            // An older run must not replace the report for a newer PR head.
            if (current.state !== 'open' || current.head.sha !== pull.head.sha) {
              core.info('Skipping report for a closed PR or an outdated commit.');
              return;
            }
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body });
            }
