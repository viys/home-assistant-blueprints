name: CI

on:
  push:
    # Version tags run the same checks inside release.yml before master can move.
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: push-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      base-sha: ${{ github.event.before }}
