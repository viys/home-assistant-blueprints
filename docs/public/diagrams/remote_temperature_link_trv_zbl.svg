<text x="380" y="568" font-size="14" fill="#183642" font-weight="600" text-anchor="middle">With ZHA, readings stay separate until they reach the valve.</text>
<text x="380" y="592" font-size="12" fill="#526b76" font-weight="400" text-anchor="middle">ZHA multi-source support required. Enable external mode; ZHA removes invalid sources.</text>
