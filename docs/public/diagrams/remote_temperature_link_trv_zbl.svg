<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 617" role="img" aria-labelledby="title desc">
  <title id="title">Let the valve combine room readings</title>
  <desc id="desc">Top lane: with compatible ZHA firmware and device support, one to five source readings pass separately through Home Assistant. A two-source example of 20 and 22 degrees is averaged by the TRV-ZBL valve to 21 degrees. Bottom lane: Zigbee2MQTT uses source 1 only and forwards its 20 degree reading. This blueprint does not calculate an average in Home Assistant. Enable external mode. The valve validates numeric temperature readings.</desc>
  <style>text { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 L2 4 Z" fill="#1abcf2"/>
    </marker>
  </defs>
  <rect width="760" height="617" fill="white"/>
  <!-- Shared header; functional layouts below vary by blueprint behavior. -->
  <text x="380" y="40" font-size="22" fill="#183642" font-weight="600" text-anchor="middle">Let the valve combine room readings</text>
<text x="380" y="66" font-size="13" fill="#526b76" font-weight="400" text-anchor="middle">TRV-ZBL · Averaging location and source count depend on integration</text>

