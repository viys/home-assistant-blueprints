<text x="130" y="197" font-size="28" fill="#007fa8" font-weight="600" text-anchor="middle">21.5 °C</text>
<circle cx="130" cy="227" r="3" fill="#1abcf2"/>
<text x="130" y="266" font-size="13" fill="#526b76" font-weight="400" text-anchor="middle">Measure where you sit</text>
<path d="M210 197 L335 197" fill="none" stroke="#1abcf2" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="380" cy="197" r="34" fill="#edf9fe"/>
<path d="M361 196 L380 180 L399 196 M367 192 V213 H393 V192 M376 213 V200 H384 V213" fill="none" stroke="#007fa8" stroke-width="2" stroke-linejoin="round"/>
<text x="380" y="257" font-size="15" fill="#183642" font-weight="600" text-anchor="middle">Home Assistant</text>
<text x="380" y="279" font-size="13" fill="#526b76" font-weight="400" text-anchor="middle">Forward reading</text>
<path d="M419 197 C475 197 479 145 544 145" fill="none" stroke="#1abcf2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M419 197 C475 197 529 260 644 260" fill="none" stroke="#1abcf2" stroke-width="1.5" marker-end="url(#arrow)"/>
