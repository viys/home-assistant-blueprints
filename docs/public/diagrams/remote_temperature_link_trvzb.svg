<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
  <title id="title">Use a room sensor for your heating</title>
  <desc id="desc">One external sensor supplies 21.5 degrees Celsius through Home Assistant to one or more TRVZB target. These are external temperature readings, not heating setpoints. Enable external mode. Fahrenheit and Kelvin readings are converted to Celsius.</desc>
  <style>text { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 L2 4 Z" fill="#1abcf2"/>
    </marker>
  </defs>
  <rect width="760" height="510" fill="white"/>
  <!-- Shared header; functional layouts below vary by blueprint behavior. -->
  <text x="380" y="40" font-size="22" fill="#183642" font-weight="600" text-anchor="middle">Use a room sensor for your heating</text>
<text x="380" y="66" font-size="13" fill="#526b76" font-weight="400" text-anchor="middle">TRVZB · ZHA or Zigbee2MQTT · One temperature source</text>

  <text x="130" y="105" font-size="12" fill="#526b76" font-weight="600" text-anchor="middle">ROOM SENSOR</text>
<text x="380" y="105" font-size="12" fill="#526b76" font-weight="600" text-anchor="middle">AUTOMATION</text>
<text x="625" y="105" font-size="14" fill="#183642" font-weight="600" text-anchor="middle">TRVZB</text>
