<text x="600" y="166" font-size="18" fill="#007fa8" font-weight="600" text-anchor="middle">21.5°</text>
<path d="M582 186 v10 M594 186 v10 M606 186 v10 M618 186 v10" stroke="#b8d0db" stroke-width="2"/>
