<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 493" role="img" aria-labelledby="title desc">
  <title id="title">Let several rooms contribute one temperature</title>
  <desc id="desc">Example: Home Assistant calculates the equal-weight average of 20 and 22 degrees Celsius, then sends one 21 degree external reading to TP-WGZBA. Unavailable, invalid, self-sourced and expired readings are excluded. One or more sources may be selected. The validity period defaults to 60 minutes since the state last changed, checked every minute; identical reports do not renew it. External mode is required.</desc>
  <style>text { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 L2 4 Z" fill="#1abcf2"/>
    </marker>
  </defs>
  <rect width="760" height="493" fill="white"/>
  <!-- Shared header; functional layouts below vary by blueprint behavior. -->
  <text x="380" y="40" font-size="22" fill="#183642" font-weight="600" text-anchor="middle">Let several rooms contribute one temperature</text>
<text x="380" y="66" font-size="13" fill="#526b76" font-weight="400" text-anchor="middle">TP-WGZBA · ZHA or Zigbee2MQTT · Average calculated in Home Assistant</text>

  <rect x="265" y="105" width="220" height="286" rx="18" fill="#edf9fe" stroke="none" />
<text x="375" y="134" font-size="16" fill="#183642" font-weight="600" text-anchor="middle">Home Assistant</text>
<path d="M205 167 C225 167 230 222 254 222" fill="none" stroke="#1abcf2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M205 290 C225 290 230 252 254 252" fill="none" stroke="#1abcf2" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Sensor bounds: 50,121 to 200,213. -->
<rect x="50" y="121" width="150" height="92" rx="16" fill="white" stroke="#b6d6e3" />
<rect x="62" y="133" width="126" height="48" rx="7" fill="#edf9fe" stroke="none" />
<text x="125" y="167" font-size="28" fill="#007fa8" font-weight="600" text-anchor="middle">20 °C</text>
<circle cx="125" cy="197" r="3" fill="#1abcf2"/>
<text x="125" y="236" font-size="13" fill="#526b76" font-weight="400" text-anchor="middle">Room A</text>
<!-- Sensor bounds: 50,244 to 200,336. -->
<rect x="50" y="244" width="150" height="92" rx="16" fill="white" stroke="#b6d6e3" />
<rect x="62" y="256" width="126" height="48" rx="7" fill="#edf9fe" stroke="none" />
<text x="125" y="290" font-size="28" fill="#007fa8" font-weight="600" text-anchor="middle">22 °C</text>
<circle cx="125" cy="320" r="3" fill="#1abcf2"/>
<text x="125" y="359" font-size="13" fill="#526b76" font-weight="400" text-anchor="middle">Room B</text>
<text x="375" y="181" font-size="14" fill="#007fa8" font-weight="600" text-anchor="middle">Equal-weight average</text>
<text x="375" y="223" font-size="20" fill="#007fa8" font-weight="400" text-anchor="middle">(20 + 22) ÷ 2</text>
<text x="375" y="271" font-size="38" fill="#007fa8" font-weight="600" text-anchor="middle">21 °C</text>
<text x="375" y="311" font-size="13" fill="#526b76" font-weight="400" text-anchor="middle">Use valid sources only</text>
<text x="375" y="336" font-size="12" fill="#526b76" font-weight="400" text-anchor="middle">Exclude invalid or expired</text>
<text x="375" y="358" font-size="12" fill="#526b76" font-weight="400" text-anchor="middle">readings before averaging</text>
<path d="M490 243 L524 243" fill="none" stroke="#1abcf2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="630" y="113" font-size="15" fill="#183642" font-weight="600" text-anchor="middle">TP-WGZBA</text>
<!-- Panel bounds: 540,171 to 700,297. -->
<rect x="540" y="171" width="160" height="126" rx="15" fill="white" stroke="#96b8c8" />
<rect x="554" y="185" width="132" height="75" rx="7" fill="#edf9fe" stroke="none" />
<text x="620" y="209" font-size="12" fill="#007fa8" font-weight="400" text-anchor="middle">Remote reading</text>
<text x="620" y="245" font-size="32" fill="#007fa8" font-weight="600" text-anchor="middle">21 °C</text>
<circle cx="620" cy="278" r="8" fill="white" stroke="#96b8c8"/>
<text x="620" y="329" font-size="14" fill="#526b76" font-weight="400" text-anchor="middle">One thermostat</text>
<path d="M25 416 L735 416" fill="none" stroke="#dce8ee" stroke-width="1.5"/>
<text x="380" y="444" font-size="14" fill="#183642" font-weight="600" text-anchor="middle">20 °C and 22 °C become one 21 °C external reading.</text>
<text x="380" y="468" font-size="12" fill="#526b76" font-weight="400" text-anchor="middle">Enable external mode. If no valid source remains, updates stop until one returns.</text>
</svg>
