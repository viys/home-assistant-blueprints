<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 595" role="img" aria-labelledby="title desc">
  <title id="title">Set once on the panel, follow on three valves</title>
  <desc id="desc">A target temperature change on TP-WGZBA is forwarded through Home Assistant to TRV-ZBL, TRV-ZBT and TRVZB valves. All three show the same 21 degree target. Only panel setpoint changes trigger forwarding; measured room-temperature changes do not. Integration and setup requirements are explained in the guide.</desc>
  <style>text { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; text-anchor: middle; }</style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 L2 4 Z" fill="#1abcf2"/>
    </marker>
  </defs>
  <rect width="760" height="595" fill="white"/>
  <text x="380" y="40" font-size="22" fill="#183642" font-weight="600">Set once on the panel, follow on the valves</text>
  <text x="380" y="66" font-size="13" fill="#526b76">Target temperature linking · Forwarded setpoints: 5–30 °C</text>

  <!-- Panel bounds: x=55..215, y=217..343. -->
  <text x="135" y="188" font-size="15" fill="#183642" font-weight="600">TP-WGZBA</text>
  <rect x="55" y="217" width="160" height="126" rx="15" fill="white" stroke="#96b8c8"/>
  <rect x="69" y="231" width="132" height="75" rx="7" fill="#edf9fe"/>
  <text x="135" y="255" font-size="12" fill="#007fa8">New target</text>
  <text x="135" y="291" font-size="32" fill="#007fa8" font-weight="600">21 °C</text>
  <circle cx="135" cy="324" r="8" fill="white" stroke="#96b8c8"/>
  <text x="135" y="375" font-size="14" fill="#526b76">You change the setpoint</text>

  <!-- Fan-out: connectors stop five pixels clear of device bodies. -->
  <path d="M220 280 L335 280" fill="none" stroke="#1abcf2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M419 280 C490 280 520 140 595 140" fill="none" stroke="#1abcf2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M419 280 C480 280 535 280 595 280" fill="none" stroke="#1abcf2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M419 280 C490 280 520 420 595 420" fill="none" stroke="#1abcf2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="380" cy="280" r="34" fill="#edf9fe"/>
  <path d="M361 279 L380 263 L399 279 M367 275 V296 H393 V275 M376 296 V283 H384 V296" fill="none" stroke="#007fa8" stroke-width="2" stroke-linejoin="round"/>
  <text x="380" y="340" font-size="15" fill="#183642" font-weight="600">Home Assistant</text>
  <text x="380" y="362" font-size="13" fill="#526b76">Forward new target</text>
  <!-- TRV-ZBL: body x=606..674; label baseline y=210. -->
  <g transform="translate(640 140)">
    <ellipse cy="-42" rx="34" ry="12" fill="#f1f7fa" stroke="#96b8c8"/>
    <rect x="-34" y="-42" width="68" height="76" rx="15" fill="white" stroke="#96b8c8"/>
    <rect x="-27" y="-28" width="54" height="32" rx="6" fill="#edf9fe"/>
    <text y="-6" font-size="18" fill="#007fa8" font-weight="600">21°</text>
    <path d="M-18 14 v10 M-6 14 v10 M6 14 v10 M18 14 v10" stroke="#b8d0db" stroke-width="2"/>
    <rect x="-22" y="34" width="44" height="13" rx="3" fill="#edf3f6" stroke="#96b8c8"/>
    <text y="70" font-size="13" fill="#526b76">TRV-ZBL</text>
  </g>
  <!-- TRV-ZBT: body x=606..674; label baseline y=350. -->
  <g transform="translate(640 280)">
    <ellipse cy="-42" rx="34" ry="12" fill="#f1f7fa" stroke="#96b8c8"/>
    <rect x="-34" y="-42" width="68" height="76" rx="15" fill="white" stroke="#96b8c8"/>
    <rect x="-27" y="-28" width="54" height="32" rx="6" fill="#edf9fe"/>
    <text y="-6" font-size="18" fill="#007fa8" font-weight="600">21°</text>
    <path d="M-18 14 v10 M-6 14 v10 M6 14 v10 M18 14 v10" stroke="#b8d0db" stroke-width="2"/>
    <rect x="-22" y="34" width="44" height="13" rx="3" fill="#edf3f6" stroke="#96b8c8"/>
    <text y="70" font-size="13" fill="#526b76">TRV-ZBT</text>
  </g>
  <!-- TRVZB: body x=606..674; label baseline y=490. -->
  <g transform="translate(640 420)">
    <ellipse cy="-42" rx="34" ry="12" fill="#f1f7fa" stroke="#96b8c8"/>
    <rect x="-34" y="-42" width="68" height="76" rx="15" fill="white" stroke="#96b8c8"/>
    <rect x="-27" y="-28" width="54" height="32" rx="6" fill="#edf9fe"/>
    <text y="-6" font-size="18" fill="#007fa8" font-weight="600">21°</text>
    <path d="M-18 14 v10 M-6 14 v10 M6 14 v10 M18 14 v10" stroke="#b8d0db" stroke-width="2"/>
    <rect x="-22" y="34" width="44" height="13" rx="3" fill="#edf3f6" stroke="#96b8c8"/>
    <text y="70" font-size="13" fill="#526b76">TRVZB</text>
  </g>
  <path d="M25 520 L735 520" fill="none" stroke="#dce8ee" stroke-width="1.5"/>
  <text x="380" y="548" font-size="14" fill="#183642" font-weight="600">A new 21 °C panel target becomes a 21 °C target on each valve.</text>
  <text x="380" y="572" font-size="12" fill="#526b76">Runs when the panel setpoint changes; measured temperature changes do not trigger it.</text>
</svg>
