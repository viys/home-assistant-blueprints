blueprint:
  name: Sync Remote Temperature Sources to TP-WGZBA
  author: Sonoff
  description: >
    Synchronizes external temperature readings with a SONOFF TP-WGZBA
    thermostat through ZHA or Zigbee2MQTT. ZHA supports up to three sources on
    newer firmware and source 1 on older firmware. Zigbee2MQTT supports up to
    three sources with a compatible converter and source 1 with older converters.
    ZHA synchronization runs while the external temperature sensor is enabled
    and resumes when it is turned on. Zigbee2MQTT synchronizes each source
    on updates, and synchronizes all three sources on startup or automation
    reload with a compatible converter. Empty optional sources are unbound.
    Temperature values in Celsius, Fahrenheit, or Kelvin are automatically
    converted to Celsius.
  domain: automation
  homeassistant:
    min_version: 2025.4.0
  input:
    target_device:
      name: TP-WGZBA device
      description: Select the ZHA or Zigbee2MQTT TP-WGZBA thermostat that should receive the temperatures.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: SONOFF
              model: TP-WGZBA
            - integration: mqtt
              manufacturer: SONOFF
              model: Zigbee thermostat panel
              model_id: TP-WGZBA
    source_entity_1:
      name: Remote temperature source 1
      description: Required. Select a temperature sensor from another device. Zigbee2MQTT accepts 0 to 99.9 °C after unit conversion.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    source_entity_2:
      name: Remote temperature source 2 (optional)
      description: Requires multi-source firmware and a compatible ZHA quirk or Zigbee2MQTT converter. Leave empty to unbind the second source. Zigbee2MQTT accepts 0 to 99.9 °C.
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    source_entity_3:
      name: Remote temperature source 3 (optional)
      description: Requires multi-source firmware and a compatible ZHA quirk or Zigbee2MQTT converter. Leave empty to unbind the third source. Zigbee2MQTT accepts 0 to 99.9 °C.
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

variables:
  target_device: !input target_device
  source_entity_1: !input source_entity_1
  source_entity_2: !input source_entity_2
  source_entity_3: !input source_entity_3
  target_integration: >
    {% set ns = namespace(value='') %}
    {% for identifier in (device_attr(target_device, 'identifiers') or []) %}
      {% if identifier[0] == 'zha' %}
        {% set ns.value = 'zha' %}
      {% elif identifier[0] == 'mqtt' %}
        {% set ns.value = 'mqtt' %}
      {% endif %}
    {% endfor %}
    {{ ns.value }}
  source_entities: >
    {{ [source_entity_1, source_entity_2, source_entity_3]
       | map('trim') | list }}
  zha_temperature_source_mode: >
    {%- set ns = namespace(entities=[]) -%}
    {%- for entity in device_entities(target_device) or [] -%}
      {%- if entity.startswith('sensor.')
             and state_attr(entity, 'device_class') == 'enum'
             and states(entity) in ['internal_sensor', 'external_sensor'] -%}
        {%- set ns.entities = ns.entities + [entity] -%}
      {%- endif -%}
    {%- endfor -%}
    {{- ns.entities[0] if ns.entities | count == 1 else '' -}}
  mqtt_temperature_sensor_select: >
    {{ (device_entities(target_device) or [])
       | select('match', '^select\\..*_temperature_sensor_select$')
       | list
       | first
       | default('', true) }}
  mqtt_external_temperature_input: >
    {{ (device_entities(target_device) or [])
       | select('match', '^number\\..*_external_temperature_input$')
       | list
       | first
       | default('', true) }}
  mqtt_remote_slots: >
    {%- set ns = namespace(slots=[]) -%}
    {%- for index in range(1, 4) -%}
      {%- set numbers = (device_entities(target_device) or [])
          | select('match', '^number\\..*_external_temperature_input_' ~ index ~ '$') | list -%}
      {%- set selects = (device_entities(target_device) or [])
          | select('match', '^select\\..*_external_temperature_input_' ~ index ~ '_state$') | list -%}
      {%- if numbers | count == 1 and selects | count == 1 -%}
        {%- set ns.slots = ns.slots + [dict(source=source_entities[index - 1],
            number=numbers[0], state=selects[0], index=index)] -%}
      {%- endif -%}
    {%- endfor -%}
    {{- ns.slots -}}
  mqtt_supports_multi_remote_temperature: "{{ mqtt_remote_slots | count == 3 }}"
  full_sync: >
    {{ trigger.id in ['ha_started', 'automation_reloaded']
       or (trigger.id == 'source_changed'
           and trigger.event.data.entity_id == zha_temperature_source_mode
           and trigger.event.data.new_state is not none
           and trigger.event.data.new_state.state == 'external_sensor') }}
  target_ieee: >
    {%- for identifier in (device_attr(target_device, 'identifiers') or []) -%}
      {%- if identifier[0] == 'zha' -%}
        {{ identifier[1] }}
      {%- endif -%}
    {%- endfor %}
  target_sw_version: "{{ device_attr(target_device, 'sw_version') or '' }}"
  supports_multi_remote_temperature: >
    {% set version = target_sw_version | trim | lower %}
    {% if version.startswith('0x') and version[2:] | length == 8 %}
      {% set encoded_version = version[2:] | int(default=0, base=16) %}
      {{ encoded_version >= 4102 }}
    {% else %}
      false
    {% endif %}
  has_extra_sources: >
    {{ source_entity_2 | trim != '' or source_entity_3 | trim != '' }}
  source_1_valid: >
    {{ source_entity_1 | trim != ''
       and source_entity_1 not in (device_entities(target_device) or [])
       and is_number(states(source_entity_1))
       and state_attr(source_entity_1, 'unit_of_measurement') in ['°C', '°F', 'K']
       and -273.15 <= ((states(source_entity_1) | float - 32) * 5 / 9
                       if state_attr(source_entity_1, 'unit_of_measurement') == '°F'
                       else states(source_entity_1) | float - 273.15
                       if state_attr(source_entity_1, 'unit_of_measurement') == 'K'
                       else states(source_entity_1) | float) <= 327.67 }}
  source_2_valid: >
    {{ source_entity_2 | trim != ''
       and source_entity_2 not in (device_entities(target_device) or [])
       and is_number(states(source_entity_2))
       and state_attr(source_entity_2, 'unit_of_measurement') in ['°C', '°F', 'K']
       and -273.15 <= ((states(source_entity_2) | float - 32) * 5 / 9
                       if state_attr(source_entity_2, 'unit_of_measurement') == '°F'
                       else states(source_entity_2) | float - 273.15
                       if state_attr(source_entity_2, 'unit_of_measurement') == 'K'
                       else states(source_entity_2) | float) <= 327.67 }}
  source_3_valid: >
    {{ source_entity_3 | trim != ''
       and source_entity_3 not in (device_entities(target_device) or [])
       and is_number(states(source_entity_3))
       and state_attr(source_entity_3, 'unit_of_measurement') in ['°C', '°F', 'K']
       and -273.15 <= ((states(source_entity_3) | float - 32) * 5 / 9
                       if state_attr(source_entity_3, 'unit_of_measurement') == '°F'
                       else states(source_entity_3) | float - 273.15
                       if state_attr(source_entity_3, 'unit_of_measurement') == 'K'
                       else states(source_entity_3) | float) <= 327.67 }}

triggers:
  - trigger: event
    id: source_changed
    event_type: state_changed
  - trigger: homeassistant
    id: ha_started
    event: start
  - trigger: event
    id: automation_reloaded
    event_type: automation_reloaded

conditions:
  - condition: template
    value_template: >
      {{ trigger.id in ['ha_started', 'automation_reloaded']
         or (trigger.id == 'source_changed'
             and (trigger.event.data.entity_id in source_entities
                  or full_sync | bool)) }}
  - condition: template
    value_template: >
      {{ device_attr(target_device, 'manufacturer') == 'SONOFF'
         and ((target_integration | trim == 'zha'
               and device_attr(target_device, 'model') == 'TP-WGZBA'
               and target_ieee | trim != ''
               and zha_temperature_source_mode | trim != ''
               and is_state(zha_temperature_source_mode, 'external_sensor'))
              or (target_integration | trim == 'mqtt'
                  and device_attr(target_device, 'model') == 'Zigbee thermostat panel'
                  and (mqtt_supports_multi_remote_temperature | bool
                       or (mqtt_external_temperature_input | trim != ''
                           and mqtt_temperature_sensor_select | trim != '')))) }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ target_integration | trim == 'zha' and supports_multi_remote_temperature | bool }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (source_1_valid | bool) and (full_sync | bool or trigger.event.data.entity_id == source_entity_1) }}"
                sequence:
                  - action: zha.set_zigbee_cluster_attribute
                    data:
                      ieee: "{{ target_ieee | trim }}"
                      endpoint_id: 1
                      cluster_id: 0xFC11
                      cluster_type: in
                      attribute: 0xFF11
                      value: >
                        {% set value = states(source_entity_1) | float %}
                        {% set unit = state_attr(source_entity_1, 'unit_of_measurement') %}
                        {{ (((value - 32) * 5 / 9 if unit == '°F'
                             else value - 273.15 if unit == 'K'
                             else value) * 100) | round(0) | int }}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (source_entity_2 | trim == '' or source_2_valid | bool) and (full_sync | bool or trigger.event.data.entity_id == source_entity_2) }}"
                sequence:
                  - action: zha.set_zigbee_cluster_attribute
                    data:
                      ieee: "{{ target_ieee | trim }}"
                      endpoint_id: 1
                      cluster_id: 0xFC11
                      cluster_type: in
                      attribute: 0xFF12
                      value: >
                        {% if source_entity_2 | trim == '' %}
                          -32768
                        {% else %}
                          {% set value = states(source_entity_2) | float %}
                          {% set unit = state_attr(source_entity_2, 'unit_of_measurement') %}
                          {{ (((value - 32) * 5 / 9 if unit == '°F'
                               else value - 273.15 if unit == 'K'
                               else value) * 100) | round(0) | int }}
                        {% endif %}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (source_entity_3 | trim == '' or source_3_valid | bool) and (full_sync | bool or trigger.event.data.entity_id == source_entity_3) }}"
                sequence:
                  - action: zha.set_zigbee_cluster_attribute
                    data:
                      ieee: "{{ target_ieee | trim }}"
                      endpoint_id: 1
                      cluster_id: 0xFC11
                      cluster_type: in
                      attribute: 0xFF13
                      value: >
                        {% if source_entity_3 | trim == '' %}
                          -32768
                        {% else %}
                          {% set value = states(source_entity_3) | float %}
                          {% set unit = state_attr(source_entity_3, 'unit_of_measurement') %}
                          {{ (((value - 32) * 5 / 9 if unit == '°F'
                               else value - 273.15 if unit == 'K'
                               else value) * 100) | round(0) | int }}
                        {% endif %}

      - conditions:
          - condition: template
            value_template: "{{ target_integration | trim == 'zha' and not (supports_multi_remote_temperature | bool) }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (source_1_valid | bool) and (full_sync | bool or trigger.event.data.entity_id == source_entity_1) }}"
                sequence:
                  - action: zha.set_zigbee_cluster_attribute
                    data:
                      ieee: "{{ target_ieee | trim }}"
                      endpoint_id: 1
                      cluster_id: 0xFC11
                      cluster_type: in
                      attribute: 0xFF11
                      value: >
                        {% set value = states(source_entity_1) | float %}
                        {% set unit = state_attr(source_entity_1, 'unit_of_measurement') %}
                        {{ (((value - 32) * 5 / 9 if unit == '°F'
                             else value - 273.15 if unit == 'K'
                             else value) * 100) | round(0) | int }}

      - conditions:
          - condition: template
            value_template: "{{ target_integration | trim == 'mqtt' and mqtt_supports_multi_remote_temperature | bool }}"
        sequence:
          - repeat:
              for_each: "{{ mqtt_remote_slots }}"
              sequence:
                - variables:
                    source: "{{ repeat.item.source }}"
                    source_valid: "{{ [source_1_valid, source_2_valid, source_3_valid][repeat.item.index - 1] }}"
                - choose:
                    - conditions:
                        - condition: template
                          value_template: >
                            {{ full_sync | bool and source == '' and repeat.item.index > 1 }}
                      sequence:
                        - action: select.select_option
                          target:
                            entity_id: "{{ repeat.item.state }}"
                          data:
                            option: unbound
                    - conditions:
                        - condition: template
                          value_template: >
                            {{ source_valid | bool
                               and (full_sync | bool or trigger.event.data.entity_id == source) }}
                      sequence:
                        - variables:
                            temperature_c: >
                              {% set temperature = states(source) | float %}
                              {% set unit = state_attr(source, 'unit_of_measurement') %}
                              {{ (temperature - 32) * 5 / 9 if unit == '°F'
                                 else temperature - 273.15 if unit == 'K'
                                 else temperature }}
                        - condition: template
                          value_template: "{{ 0 <= temperature_c | float <= 99.9 }}"
                        # The converter defaults this slot to online when a temperature is set.
                        - action: number.set_value
                          target:
                            entity_id: "{{ repeat.item.number }}"
                          data:
                            value: "{{ temperature_c | float | round(1) }}"

      - conditions:
          - condition: template
            value_template: >
              {{ target_integration | trim == 'mqtt'
                 and not (mqtt_supports_multi_remote_temperature | bool)
                 and source_1_valid | bool
                 and trigger.id == 'source_changed'
                 and trigger.event.data.entity_id == source_entity_1 }}
        sequence:
          - action: number.set_value
            target:
              entity_id: "{{ mqtt_external_temperature_input | trim }}"
            data:
              value: >
                {% set temperature = states(source_entity_1) | float %}
                {% set unit = state_attr(source_entity_1, 'unit_of_measurement') %}
                {{ (temperature - 32) * 5 / 9 if unit == '°F'
                   else temperature - 273.15 if unit == 'K'
                   else temperature }}

mode: queued
