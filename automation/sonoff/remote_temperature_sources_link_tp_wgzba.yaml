blueprint:
  name: Sync Remote Temperature Sources to TP-WGZBA
  author: Sonoff
  description: >
    Synchronizes one to three external temperature sources with a SONOFF
    TP-WGZBA thermostat through ZHA. The TP-WGZBA also supports Zigbee2MQTT,
    but this blueprint currently implements the ZHA path; Zigbee2MQTT support
    is under development. Firmware 0x00001004 uses the existing single-source
    protocol; firmware 0x00001006 and newer use three incremental
    remote-temperature slots. On older firmware, source 2 and source 3 are
    ignored and only source 1 is synchronized. Synchronization runs only while
    the thermostat's External temperature sensor switch is enabled, and resumes
    when the switch is turned on.
  domain: automation
  input:
    target_device:
      name: TP-WGZBA device
      description: Select the ZHA TP-WGZBA thermostat that should receive the temperatures.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: SONOFF
              model: TP-WGZBA
    source_entity_1:
      name: Remote temperature source 1
      description: Required. Select a temperature sensor from another device.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    source_entity_2:
      name: Remote temperature source 2 (optional)
      description: Leave empty when a second remote source is not used.
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    source_entity_3:
      name: Remote temperature source 3 (optional)
      description: Leave empty when a third remote source is not used.
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

variables:
  target_device: !input target_device
  source_entity_1: !input source_entity_1
  source_entity_2: !input source_entity_2
  source_entity_3: !input source_entity_3
  source_entities: >
    {{ [source_entity_1, source_entity_2, source_entity_3]
       | map('trim') | list }}
  zha_external_temperature_sensor_switch: >
    {{ (device_entities(target_device) or [])
       | select('match', '^switch\\..*_external_temperature_sensor$')
       | list
       | first
       | default('', true) }}
  full_sync: >
    {{ trigger.id in ['ha_started', 'automation_reloaded']
       or (trigger.id == 'source_changed'
           and trigger.event.data.entity_id == zha_external_temperature_sensor_switch
           and trigger.event.data.new_state is not none
           and trigger.event.data.new_state.state == 'on') }}
  target_ieee: >
    {%- for identifier in (device_attr(target_device, 'identifiers') or []) -%}
      {%- if identifier[0] == 'zha' -%}
        {{ identifier[1] }}
      {%- endif -%}
    {%- endfor %}
  target_sw_version: "{{ device_attr(target_device, 'sw_version') or '' }}"
  supports_multi_remote_temperature: >
    {% set version = target_sw_version | trim | lower %}
    {% if version.startswith('0x') and version[2:] | length == 8 %}
      {% set encoded_version = version[2:] | int(default=0, base=16) %}
      {{ encoded_version >= 4102 }}
    {% else %}
      false
    {% endif %}
  has_extra_sources: >
    {{ source_entity_2 | trim != '' or source_entity_3 | trim != '' }}
  source_1_valid: >
    {{ source_entity_1 | trim != ''
       and source_entity_1 not in (device_entities(target_device) or [])
       and is_number(states(source_entity_1))
       and state_attr(source_entity_1, 'unit_of_measurement') in ['°C', '°F', 'K']
       and -273.15 <= ((states(source_entity_1) | float - 32) * 5 / 9
                       if state_attr(source_entity_1, 'unit_of_measurement') == '°F'
                       else states(source_entity_1) | float - 273.15
                       if state_attr(source_entity_1, 'unit_of_measurement') == 'K'
                       else states(source_entity_1) | float) <= 327.67 }}
  source_2_valid: >
    {{ source_entity_2 | trim != ''
       and source_entity_2 not in (device_entities(target_device) or [])
       and is_number(states(source_entity_2))
       and state_attr(source_entity_2, 'unit_of_measurement') in ['°C', '°F', 'K']
       and -273.15 <= ((states(source_entity_2) | float - 32) * 5 / 9
                       if state_attr(source_entity_2, 'unit_of_measurement') == '°F'
                       else states(source_entity_2) | float - 273.15
                       if state_attr(source_entity_2, 'unit_of_measurement') == 'K'
                       else states(source_entity_2) | float) <= 327.67 }}
  source_3_valid: >
    {{ source_entity_3 | trim != ''
       and source_entity_3 not in (device_entities(target_device) or [])
       and is_number(states(source_entity_3))
       and state_attr(source_entity_3, 'unit_of_measurement') in ['°C', '°F', 'K']
       and -273.15 <= ((states(source_entity_3) | float - 32) * 5 / 9
                       if state_attr(source_entity_3, 'unit_of_measurement') == '°F'
                       else states(source_entity_3) | float - 273.15
                       if state_attr(source_entity_3, 'unit_of_measurement') == 'K'
                       else states(source_entity_3) | float) <= 327.67 }}

triggers:
  - trigger: event
    id: source_changed
    event_type: state_changed
  - trigger: homeassistant
    id: ha_started
    event: start
  - trigger: event
    id: automation_reloaded
    event_type: automation_reloaded

conditions:
  - condition: template
    value_template: >
      {{ trigger.id in ['ha_started', 'automation_reloaded']
         or (trigger.id == 'source_changed'
             and (trigger.event.data.entity_id in source_entities
                  or (trigger.event.data.entity_id == zha_external_temperature_sensor_switch
                      and trigger.event.data.new_state is not none
                      and trigger.event.data.new_state.state == 'on'))) }}
  - condition: template
    value_template: >
      {{ target_ieee | trim != ''
         and zha_external_temperature_sensor_switch | trim != ''
         and is_state(zha_external_temperature_sensor_switch, 'on')
         and device_attr(target_device, 'manufacturer') == 'SONOFF'
         and device_attr(target_device, 'model') == 'TP-WGZBA' }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ supports_multi_remote_temperature | bool }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (source_1_valid | bool) and (full_sync | bool or trigger.event.data.entity_id == source_entity_1) }}"
                sequence:
                  - action: zha.set_zigbee_cluster_attribute
                    data:
                      ieee: "{{ target_ieee | trim }}"
                      endpoint_id: 1
                      cluster_id: 0xFC11
                      cluster_type: in
                      attribute: 0xFF11
                      value: >
                        {% set value = states(source_entity_1) | float %}
                        {% set unit = state_attr(source_entity_1, 'unit_of_measurement') %}
                        {{ (((value - 32) * 5 / 9 if unit == '°F'
                             else value - 273.15 if unit == 'K'
                             else value) * 100) | round(0) | int }}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (source_entity_2 | trim == '' or source_2_valid | bool) and (full_sync | bool or trigger.event.data.entity_id == source_entity_2) }}"
                sequence:
                  - action: zha.set_zigbee_cluster_attribute
                    data:
                      ieee: "{{ target_ieee | trim }}"
                      endpoint_id: 1
                      cluster_id: 0xFC11
                      cluster_type: in
                      attribute: 0xFF12
                      value: >
                        {% if source_entity_2 | trim == '' %}
                          -32768
                        {% else %}
                          {% set value = states(source_entity_2) | float %}
                          {% set unit = state_attr(source_entity_2, 'unit_of_measurement') %}
                          {{ (((value - 32) * 5 / 9 if unit == '°F'
                               else value - 273.15 if unit == 'K'
                               else value) * 100) | round(0) | int }}
                        {% endif %}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (source_entity_3 | trim == '' or source_3_valid | bool) and (full_sync | bool or trigger.event.data.entity_id == source_entity_3) }}"
                sequence:
                  - action: zha.set_zigbee_cluster_attribute
                    data:
                      ieee: "{{ target_ieee | trim }}"
                      endpoint_id: 1
                      cluster_id: 0xFC11
                      cluster_type: in
                      attribute: 0xFF13
                      value: >
                        {% if source_entity_3 | trim == '' %}
                          -32768
                        {% else %}
                          {% set value = states(source_entity_3) | float %}
                          {% set unit = state_attr(source_entity_3, 'unit_of_measurement') %}
                          {{ (((value - 32) * 5 / 9 if unit == '°F'
                               else value - 273.15 if unit == 'K'
                               else value) * 100) | round(0) | int }}
                        {% endif %}

      - conditions:
          - condition: template
            value_template: "{{ not (supports_multi_remote_temperature | bool) }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (source_1_valid | bool) and (full_sync | bool or trigger.event.data.entity_id == source_entity_1) }}"
                sequence:
                  - action: zha.set_zigbee_cluster_attribute
                    data:
                      ieee: "{{ target_ieee | trim }}"
                      endpoint_id: 1
                      cluster_id: 0xFC11
                      cluster_type: in
                      attribute: 0xFF11
                      value: >
                        {% set value = states(source_entity_1) | float %}
                        {% set unit = state_attr(source_entity_1, 'unit_of_measurement') %}
                        {{ (((value - 32) * 5 / 9 if unit == '°F'
                             else value - 273.15 if unit == 'K'
                             else value) * 100) | round(0) | int }}

mode: queued
