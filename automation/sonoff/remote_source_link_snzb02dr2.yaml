blueprint:
  name: Sync Remote Sensor to SNZB-02DR2
  author: Sonoff
  description: >
    Synchronizes an external temperature reading and an optional humidity
    reading with a SONOFF SNZB-02DR2 connected through ZHA or Zigbee2MQTT.
    Each source is validated and written independently to the selected remote
    slot when it updates. Updates received during a send are combined using
    each source's latest reading. Temperature values in Celsius, Fahrenheit,
    or Kelvin are automatically converted to Celsius.
  domain: automation

  homeassistant:
    # The drain loop needs assignments to persist across nested script scopes.
    min_version: 2025.3.0

  input:
    target_device:
      name: SNZB-02DR2 device
      description: Select the ZHA or Zigbee2MQTT SNZB-02DR2 to receive the reading.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: SONOFF
              model: SNZB-02DR2
            - integration: mqtt
              manufacturer: SONOFF
              model: Temperature and humidity sensor with display and relay control
              model_id: SNZB-02DR2

    source_temperature:
      name: External temperature sensor
      description: Required. Select a temperature sensor from a different device.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    source_humidity:
      name: External humidity sensor (optional)
      description: Select a relative humidity sensor from a different device.
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: humidity

    source_slot:
      name: Remote slot
      description: Select the remote slot used on the SNZB-02DR2.
      default: "1"
      selector:
        select:
          options:
            - label: Slot 1
              value: "1"
            - label: Slot 2
              value: "2"

variables:
  target_device: !input target_device
  temperature_entity: !input source_temperature
  humidity_entity: !input source_humidity
  slot: !input source_slot
  # Capture both versions before queuing so a waiting run can recover updates
  # received after it was queued, including updates rejected by the queue limit.
  initial_temperature_version: >
    {% set source = states[temperature_entity] %}
    {{ source.last_updated.isoformat() if source is not none else '' }}
  initial_humidity_version: >
    {% set source = states[humidity_entity] if humidity_entity | trim != '' else none %}
    {{ source.last_updated.isoformat() if source is not none else '' }}
  target_integration: >
    {% set ns = namespace(value='') %}
    {% for identifier in (device_attr(target_device, 'identifiers') or []) %}
      {% if identifier[0] == 'zha' %}
        {% set ns.value = 'zha' %}
      {% elif identifier[0] == 'mqtt' %}
        {% set ns.value = 'mqtt' %}
      {% endif %}
    {% endfor %}
    {{ ns.value }}
  target_ieee: >
    {%- for identifier in (device_attr(target_device, 'identifiers') or []) -%}
      {%- if identifier[0] == 'zha' -%}
        {{ identifier[1] }}
      {%- endif -%}
    {%- endfor %}
  target_temperature_entity: >
    {{ (device_entities(target_device) or [])
       | select('match', '^number\\..*_source_' ~ slot ~ '_temperature$')
       | list
       | first
       | default('', true) }}
  target_humidity_entity: >
    {{ (device_entities(target_device) or [])
       | select('match', '^number\\..*_source_' ~ slot ~ '_humidity$')
       | list
       | first
       | default('', true) }}

triggers:
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input source_temperature
    id: temperature_changed
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input source_humidity
    id: humidity_changed
  - trigger: homeassistant
    id: ha_started
    event: start

conditions:
  - condition: template
    value_template: >
      {{ device_attr(target_device, 'manufacturer') == 'SONOFF'
         and ((target_integration | trim == 'zha'
               and device_attr(target_device, 'model') == 'SNZB-02DR2'
               and target_ieee | trim != '')
              or (target_integration | trim == 'mqtt'
                  and device_attr(target_device, 'model_id') == 'SNZB-02DR2')) }}

actions:
  - condition: template
    value_template: >
      {{ trigger.id in ['temperature_changed', 'humidity_changed']
         or (trigger.id == 'ha_started' and target_integration | trim == 'mqtt') }}
  - variables:
      last_temperature_version: "{{ initial_temperature_version }}"
      last_humidity_version: "{{ initial_humidity_version }}"
  # Keep only each source's latest snapshot. A new event can queue one wake-up;
  # further events are recovered by comparing source versions after every send.
  - repeat:
      sequence:
        - variables:
            temperature_sample: >
              {% set source = states[temperature_entity] %}
              {{ {'version': source.last_updated.isoformat(),
                  'value': source.state,
                  'unit': source.attributes.get('unit_of_measurement')}
                 if source is not none
                 else {'version': '', 'value': 'unknown', 'unit': none} }}
            humidity_sample: >
              {% set source = states[humidity_entity] if humidity_entity | trim != '' else none %}
              {{ {'version': source.last_updated.isoformat(), 'value': source.state}
                 if source is not none else {'version': '', 'value': 'unknown'} }}
            send_temperature: >
              {{ temperature_sample.version != last_temperature_version
                 or (repeat.first and trigger.id in ['temperature_changed', 'ha_started']) }}
            send_humidity: >
              {{ humidity_sample.version != last_humidity_version
                 or (repeat.first and trigger.id in ['humidity_changed', 'ha_started']) }}
        # Handle errors supported by HA around the whole measurement, not each
        # ZHA command. Raw ZHA exceptions/timeouts can still abort this run.
        # If slot selection raises, skip the value; ZCL error statuses that the
        # service does not expose cannot be checked by this blueprint.
        - alias: Send temperature independently
          continue_on_error: true
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ send_temperature
                           and is_number(temperature_sample.value)
                           and temperature_sample.unit in ['°C', '°F', 'K']
                           and temperature_entity not in (device_entities(target_device) or []) }}
                  sequence:
                    - variables:
                        temperature_c: >
                          {% set value = temperature_sample.value | float %}
                          {% set unit = temperature_sample.unit %}
                          {{ (value - 32) * 5 / 9 if unit == '°F'
                             else value - 273.15 if unit == 'K' else value }}
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ target_integration | trim == 'zha' }}"
                          sequence:
                            - action: zha.set_zigbee_cluster_attribute
                              data:
                                ieee: "{{ target_ieee | trim }}"
                                endpoint_id: 1
                                cluster_id: 0xFC11
                                cluster_type: in
                                attribute: 0xFFF1
                                value: "{{ slot | int - 1 }}"
                            - action: zha.set_zigbee_cluster_attribute
                              data:
                                ieee: "{{ target_ieee | trim }}"
                                endpoint_id: 1
                                cluster_id: 0xFC11
                                cluster_type: in
                                attribute: 0xFFF3
                                value: "{{ (temperature_c | float * 100) | round(0) | int }}"
                        - conditions:
                            - condition: template
                              value_template: >
                                {{ target_integration | trim == 'mqtt'
                                   and target_temperature_entity | trim != '' }}
                          sequence:
                            - action: number.set_value
                              target:
                                entity_id: "{{ target_temperature_entity | trim }}"
                              data:
                                value: "{{ temperature_c | float | round(1) }}"
        - alias: Send humidity independently
          continue_on_error: true
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ send_humidity
                           and humidity_entity | trim != ''
                           and humidity_entity not in (device_entities(target_device) or [])
                           and is_number(humidity_sample.value)
                           and 0 <= humidity_sample.value | float <= 99.9 }}
                  sequence:
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ target_integration | trim == 'zha' }}"
                          sequence:
                            - action: zha.set_zigbee_cluster_attribute
                              data:
                                ieee: "{{ target_ieee | trim }}"
                                endpoint_id: 1
                                cluster_id: 0xFC11
                                cluster_type: in
                                attribute: 0xFFF2
                                value: "{{ slot | int - 1 }}"
                            - action: zha.set_zigbee_cluster_attribute
                              data:
                                ieee: "{{ target_ieee | trim }}"
                                endpoint_id: 1
                                cluster_id: 0xFC11
                                cluster_type: in
                                attribute: 0xFFF4
                                value: "{{ (humidity_sample.value | float * 100) | round(0) | int }}"
                        - conditions:
                            - condition: template
                              value_template: >
                                {{ target_integration | trim == 'mqtt'
                                   and target_humidity_entity | trim != '' }}
                          sequence:
                            - action: number.set_value
                              target:
                                entity_id: "{{ target_humidity_entity | trim }}"
                              data:
                                value: "{{ humidity_sample.value | float | round(1) }}"
        # Consume attempted/invalid snapshots as well as successful ones, so a
        # failed old reading is never retried indefinitely ahead of new data.
        - variables:
            last_temperature_version: "{{ temperature_sample.version }}"
            last_humidity_version: "{{ humidity_sample.version }}"
      until:
        - condition: template
          value_template: >
            {% set temperature = states[temperature_entity] %}
            {% set humidity = states[humidity_entity] if humidity_entity | trim != '' else none %}
            {{ (temperature.last_updated.isoformat() if temperature is not none else '')
                 == last_temperature_version
               and (humidity.last_updated.isoformat() if humidity is not none else '')
                 == last_humidity_version }}

mode: queued
max: 2
max_exceeded: warning
