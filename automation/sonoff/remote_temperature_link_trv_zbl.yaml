blueprint:
  name: "Sync Remote Temperature to TRV-ZBL"
  author: Sonoff
  description: >
    Synchronizes an external temperature reading with a SONOFF TRV-ZBL
    thermostatic radiator valve connected through ZHA or Zigbee2MQTT. The
    reading is applied whenever the valve's external temperature mode is
    enabled, immediately and on each source update. Temperature values in
    Celsius, Fahrenheit, or Kelvin are automatically converted to Celsius.
  domain: automation

  input:
    target_device:
      name: TRV-ZBL device
      description: Select the ZHA or Zigbee2MQTT radiator valve that should receive the temperature.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: SONOFF
              model: TRV-ZBL
            - integration: mqtt
              manufacturer: SONOFF
              model: Zigbee thermostatic radiator valve
              model_id: TRV-ZBL
    source_entity:
      name: External temperature sensor
      description: Select a temperature sensor from another device. The target TRV-ZBL's own temperature is not a valid source.
      selector:
        entity:
          filter:
            domain: sensor
            device_class: temperature

variables:
  target_device: !input target_device
  source_entity: !input source_entity
  target_integration: >
    {% set ns = namespace(value='') %}
    {% for identifier in (device_attr(target_device, 'identifiers') or []) %}
      {% if identifier[0] == 'zha' %}
        {% set ns.value = 'zha' %}
      {% elif identifier[0] == 'mqtt' %}
        {% set ns.value = 'mqtt' %}
      {% endif %}
    {% endfor %}
    {{ ns.value }}
  # The handler exposes FF03 as a read-only enum. Its options are the stable
  # contract; translated display names and user-assigned entity IDs are ignored.
  zha_temperature_source_status: >
    {% set ns = namespace(entities=[]) %}
    {% for entity in (device_entities(target_device) or []) %}
      {% if entity.startswith('sensor.')
            and state_attr(entity, 'device_class') == 'enum'
            and state_attr(entity, 'options') == ['internal_sensor', 'external_sensor'] %}
        {% set ns.entities = ns.entities + [entity] %}
      {% endif %}
    {% endfor %}
    {{ ns.entities[0] if ns.entities | count == 1 else '' }}
  # Match the converter's external_temperature_input expose contract, not its
  # translated name. Require a unique match on this device before writing.
  mqtt_external_temperature_input: >
    {% set ns = namespace(entities=[]) %}
    {% for entity in (device_entities(target_device) or []) %}
      {% if entity.startswith('number.')
            and state_attr(entity, 'unit_of_measurement') == '°C'
            and state_attr(entity, 'min') == 0
            and state_attr(entity, 'max') == 99.9
            and state_attr(entity, 'step') == 0.1 %}
        {% set ns.entities = ns.entities + [entity] %}
      {% endif %}
    {% endfor %}
    {{ ns.entities[0] if ns.entities | count == 1 else '' }}
  target_ieee: >
    {%- for identifier in (device_attr(target_device, 'identifiers') or []) -%}
      {%- if identifier[0] == 'zha' -%}
        {{ identifier[1] }}
      {%- endif -%}
    {%- endfor %}

triggers:
  - trigger: state
    entity_id: !input source_entity
    id: source_temperature
    not_to:
      - "unknown"
      - "unavailable"
  - trigger: event
    event_type: state_changed
    id: external_temperature_sensor_enabled

conditions:
  - condition: template
    value_template: >
      {{ is_number(states(source_entity))
         and state_attr(source_entity, 'unit_of_measurement') in ['°C', '°F', 'K']
         and source_entity not in (device_entities(target_device) or [])
         and device_attr(target_device, 'manufacturer') == 'SONOFF'
         and ((target_integration | trim == 'zha'
               and device_attr(target_device, 'model') == 'TRV-ZBL'
               and target_ieee | trim != ''
               and zha_temperature_source_status.startswith('sensor.')
               and zha_temperature_source_status in (device_entities(target_device) or [])
               and is_state(zha_temperature_source_status, 'external_sensor')
               and (trigger.id == 'source_temperature'
                    or (trigger.event.data.entity_id == zha_temperature_source_status
                        and trigger.event.data.new_state is not none
                        and trigger.event.data.new_state.state == 'external_sensor')))
              or (target_integration | trim == 'mqtt'
                  and device_attr(target_device, 'model') == 'Zigbee thermostatic radiator valve'
                  and mqtt_external_temperature_input.startswith('number.')
                  and mqtt_external_temperature_input in (device_entities(target_device) or [])
                  and trigger.id == 'source_temperature')) }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ target_integration | trim == 'zha' }}"
        sequence:
          - action: zha.set_zigbee_cluster_attribute
            data:
              ieee: "{{ target_ieee | trim }}"
              endpoint_id: 1
              cluster_id: 0xFC11
              cluster_type: in
              # 0xFF02 is the quirk's int16 entry point for 0x601E:T=0x01.
              # The quirk owns the uint8-array encoding required by TRV-ZBL firmware.
              attribute: 0xFF02
              value: >
                {% set temperature = states(source_entity) | float %}
                {% set unit = state_attr(source_entity, 'unit_of_measurement') %}
                {{ (((temperature - 32) * 5 / 9 if unit == '°F'
                     else temperature - 273.15 if unit == 'K'
                     else temperature) * 100) | round(0) | int }}
    # The global conditions admit only enabled ZHA or validated MQTT updates.
    default:
      - action: number.set_value
        target:
          entity_id: "{{ mqtt_external_temperature_input | trim }}"
        data:
          value: >
            {% set temperature = states(source_entity) | float %}
            {% set unit = state_attr(source_entity, 'unit_of_measurement') %}
            {{ (temperature - 32) * 5 / 9 if unit == '°F'
               else temperature - 273.15 if unit == 'K'
               else temperature }}

mode: restart
