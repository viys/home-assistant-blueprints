blueprint:
  name: Sync Average Temperature to TRV-ZBT
  author: Sonoff
  description: >
    Synchronizes the average of external temperature readings with one or more SONOFF
    TRV-ZBT thermostatic radiator valves connected through ZHA or Zigbee2MQTT.
    The average is applied while external temperature mode is enabled, on source updates,
    startup, automation reload, and every minute. Unavailable, invalid, and
    expired sources are excluded. When all sources are excluded, synchronization
    stops until a valid source returns. Temperature values in Celsius,
    Fahrenheit, or Kelvin are automatically converted to Celsius.
  domain: automation
  homeassistant:
    min_version: 2025.4.0
  input:
    target_device:
      name: TRV-ZBT devices
      description: Select one or more ZHA or Zigbee2MQTT radiator valves and enable their external temperature mode. Use a compatible ZHA quirk or Zigbee2MQTT converter. Use only one temperature synchronization automation per valve. Unavailable or failed valves do not prevent updates to the others.
      selector:
        device:
          multiple: true
          filter:
            - integration: zha
              manufacturer: SONOFF
              model: TRV-ZBT
            - integration: mqtt
              manufacturer: SONOFF
              model: Zigbee thermostatic radiator valve
              model_id: TRV-ZBT
    source_timeout:
      name: Temperature validity period
      description: Shared by all selected temperature sources. Exclude a source when its temperature state has not changed for this many minutes. Repeated identical readings and attribute updates do not extend validity. Home Assistant restarts may extend validity. Expiration is checked every minute.
      default: 60
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: min
          mode: box
    source_entities:
      name: External temperature sensors
      description: Select one or more temperature sensors from other devices. Each distinct sensor has equal weight. Sensors belonging to any selected radiator valve are excluded. The average is sent using the integration's external temperature input and is subject to its supported temperature range.
      selector:
        entity:
          multiple: true
          filter:
            domain: sensor
            device_class: temperature

variables:
  target_device: !input target_device
  # Normalize the selection before deduplicating target devices.
  target_devices: "{{ ([target_device] if target_device is string else target_device) | unique | list }}"
  source_entities: !input source_entities
  source_timeout: !input source_timeout
  target_entities: >
    {% set ns = namespace(entities=[]) %}
    {% for device in target_devices %}
      {% set ns.entities = ns.entities + (device_entities(device) or []) %}
    {% endfor %}
    {{ ns.entities | unique | list }}
  # Admit only mode transitions and destination recovery, never write echoes.
  # HA appends numeric suffixes when devices produce the same entity names.
  target_mode_entities: >
    {{ target_entities
       | select('match', '^(switch\\..*_(temperature_sensor_select|external_temperature_sensor)|select\\..*_temperature_sensor_select)(?:_[0-9]+)?$')
       | list }}
  target_value_entities: >
    {{ target_entities
       | select('match', '^number\\..*_(external_temperature_sensor_value|external_temperature_input)(?:_[0-9]+)?$')
       | list }}

triggers:
  - trigger: state
    id: source_changed
    entity_id: !input source_entities
  - trigger: time_pattern
    id: periodic_sync
    minutes: "/1"
  - trigger: homeassistant
    id: ha_started
    event: start
  - trigger: event
    id: automation_reloaded
    event_type: automation_reloaded
  - trigger: event
    id: target_mode_changed
    event_type: state_changed

conditions:
  - condition: template
    value_template: >
      {{ trigger.id != 'target_mode_changed'
         or (trigger.event.data.new_state is not none
             and (trigger.event.data.old_state is none
                  or trigger.event.data.old_state.state != trigger.event.data.new_state.state)
             and (trigger.event.data.entity_id in target_mode_entities
                  or (trigger.event.data.entity_id in target_value_entities
                      and trigger.event.data.old_state is not none
                      and trigger.event.data.old_state.state in ['unknown', 'unavailable']
                      and is_number(trigger.event.data.new_state.state)))) }}

actions:
  - variables:
      valid_temperatures: >
        {% set ns = namespace(values=[]) %}
        {% set current_time = now() %}
        {% for entity in source_entities | unique | list %}
          {% set source = states[entity] %}
          {% set unit = state_attr(entity, 'unit_of_measurement') %}
          {% if source is not none
                and entity not in target_entities
                and is_number(source.state)
                and unit in ['°C', '°F', 'K']
                and 0 <= (current_time - source.last_changed).total_seconds()
                       < source_timeout | float * 60 %}
            {% set value = source.state | float %}
            {% set temperature = (value - 32) * 5 / 9 if unit == '°F'
                                 else value - 273.15 if unit == 'K' else value %}
            {% set ns.values = ns.values + [temperature] %}
          {% endif %}
        {% endfor %}
        {{ ns.values }}
  # Do not refresh the device's remote temperature when every source has expired.
  - condition: template
    value_template: "{{ valid_temperatures | count > 0 }}"
  - variables:
      average_temperature: "{{ ((valid_temperatures | sum) / (valid_temperatures | count)) | round(1) }}"
  - repeat:
      for_each: "{{ target_devices }}"
      sequence:
        - variables:
            target_device: "{{ repeat.item }}"
            target_integration: >
              {% set ns = namespace(value='') %}
              {% for identifier in (device_attr(target_device, 'identifiers') or []) %}
                {% if identifier[0] in ['zha', 'mqtt'] %}
                  {% set ns.value = identifier[0] %}
                {% endif %}
              {% endfor %}
              {{ ns.value }}
            zha_temperature_sensor_switch: >
              {{ (device_entities(target_device) or [])
                 | select('match', '^switch\\..*_(temperature_sensor_select|external_temperature_sensor)(?:_[0-9]+)?$')
                 | list
                 | first
                 | default('', true) }}
            zha_external_temperature_sensor_value: >
              {{ (device_entities(target_device) or [])
                 | select('match', '^number\\..*_external_temperature_sensor_value(?:_[0-9]+)?$')
                 | list
                 | first
                 | default('', true) }}
            mqtt_temperature_sensor_select: >
              {{ (device_entities(target_device) or [])
                 | select('match', '^select\\..*_temperature_sensor_select(?:_[0-9]+)?$')
                 | list
                 | first
                 | default('', true) }}
            mqtt_external_temperature_input: >
              {{ (device_entities(target_device) or [])
                 | select('match', '^number\\..*_external_temperature_input(?:_[0-9]+)?$')
                 | list
                 | first
                 | default('', true) }}
        - condition: template
          value_template: >
            {{ trigger.id != 'target_mode_changed'
               or trigger.event.data.entity_id in
                  [zha_temperature_sensor_switch, mqtt_temperature_sensor_select,
                   zha_external_temperature_sensor_value, mqtt_external_temperature_input] }}
        # Evaluate each valve's current mode at dispatch time, not queue admission.
        - condition: template
          value_template: >
            {{ device_attr(target_device, 'manufacturer') == 'SONOFF'
               and ((target_integration | trim == 'zha'
                     and device_attr(target_device, 'model') == 'TRV-ZBT'
                     and zha_external_temperature_sensor_value | trim != ''
                     and states(zha_external_temperature_sensor_value) not in ['unknown', 'unavailable']
                     and is_state(zha_temperature_sensor_switch, 'on'))
                    or (target_integration | trim == 'mqtt'
                        and device_attr(target_device, 'model') == 'Zigbee thermostatic radiator valve'
                        and mqtt_external_temperature_input | trim != ''
                        and states(mqtt_external_temperature_input) not in ['unknown', 'unavailable']
                        and states(mqtt_temperature_sensor_select) in
                            ['remote_temperature', 'remote_source_offline'])) }}
        - action: number.set_value
          continue_on_error: true
          target:
            entity_id: >
              {{ zha_external_temperature_sensor_value | trim if target_integration | trim == 'zha'
                 else mqtt_external_temperature_input | trim }}
          data:
            value: "{{ average_temperature }}"

mode: queued
